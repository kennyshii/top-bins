name = "topbinz-api"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "LEAGUE"
class_name = "League"

[[durable_objects.bindings]]
name = "RUN"
class_name = "Run"

[[durable_objects.bindings]]
name = "STATS"
class_name = "Stats"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "League"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Run"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["Stats"]

[build]
command = "node build.mjs"
